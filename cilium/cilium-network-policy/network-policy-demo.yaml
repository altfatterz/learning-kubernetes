apiVersion: apps/v1
kind: Deployment
metadata:
  name: app4
  namespace: dev
  labels:
    app: app4-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app4
  template:
    metadata:
      labels:
        app: app4
    spec:
      containers:
        - name: app4
          image: nginx
---
apiVersion: v1
kind: Service
metadata:
  name: app4-dev
  namespace: dev
spec:
  type: NodePort
  selector:
    app: app4
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30007
