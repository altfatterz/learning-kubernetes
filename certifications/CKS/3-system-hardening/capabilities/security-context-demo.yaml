apiVersion: v1
kind: Pod
metadata:
  name: security-context-demo
spec:
  containers:
  - name: sec-ctx-1
    image: busybox
    command: ["sh", "-c", "echo 'Hello from busybox-one'; sleep 3600"]
    securityContext:
      capabilities:
        add: [ "SYS_TIME" ]
  - name: sec-ctx-2
    image: busybox
    command: ["sh", "-c", "echo 'Hello from busybox-one'; sleep 3600"]
  - name: sec-ctx-3
    image: busybox
    command: ["sh", "-c", "echo 'Hello from busybox-one'; sleep 3600"]
    securityContext:
      allowPrivilegeEscalation: false
      runAsUser: 1000
      runAsNonRoot: true
      capabilities:
        drop: [ "ALL" ]