apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment-fixed
  labels:
    app: nginx
spec:
  replicas: 5
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      affinity:
        # ensures that the orchestrator schedules replicas on different nodes.
        podAntiAffinity:                                      
          requiredDuringSchedulingIgnoredDuringExecution:     
            - labelSelector:                                    
                matchExpressions:                               
                  - key: app                                      
                    operator: In                                  
                    values:                                       
                      - nginx                                   
              topologyKey: "kubernetes.io/hostname"             
      containers:
        - name: nginx
          image: nginx:1.14.2
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
           # --- ADD THESE MOUNTS ---
          volumeMounts:
          - name: tmp-volume
            mountPath: /tmp
          - name: cache-volume
            mountPath: /var/cache/nginx
          - name: run-volume
            mountPath: /var/run
          # security context changes
          securityContext:
            readOnlyRootFilesystem: true
            runAsUser: 1000
            runAsNonRoot: true
      # --- DEFINE THE VOLUMES ---
      volumes:
        - name: tmp-volume
          emptyDir: { }
        - name: cache-volume
          emptyDir: { }
        - name: run-volume
          emptyDir: { }
