apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-allow-from-namespace-nginx
  namespace: np-test
spec:
  podSelector:
    matchLabels:
      app: nginx
  # applies for both incoming and outgoing traffic
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: np-test
      # all ports are allowed